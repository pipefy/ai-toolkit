[project]
name = "pipefy"
dynamic = ["version"]
description = "Pipefy GraphQL client, models, and services (shared by MCP and CLI)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # No module imports email_validator. Pydantic resolves it at runtime for
    # the EmailStr annotation in models/member_invite.py, so the line is not
    # unused.
    "email-validator>=2.2.0",
    # Below 4.4: its transport switches to httpx2 whenever httpx2 is installed
    # (mcp depends on it), and httpx2 rejects pipefy_auth's httpx.Auth classes.
    # Lifting the cap means moving pipefy_auth, httpx-auth, and the SDK to httpx2.
    "gql[httpx]>=4.0.0,<4.4",
    "httpx>=0.27.0",
    "openpyxl>=3.1.5",
    "pipefy-infra==0.5.2-beta.1",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.8.1",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=6.1.1",
    "pytest-mock>=3.14.0",
    "respx>=0.22.0",
    "ruff>=0.11.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipefy_sdk"]

[tool.hatch.build.hooks.custom]

[tool.hatch.version]
path = "src/pipefy_sdk/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
    "unit: marks a unit test",
    "integration: marks a test requiring live Pipefy credentials",
]

[tool.ruff]
extend = "../../pyproject.toml"
lint.extend-select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pipefy_mcp".msg = "pipefy_sdk must not import the MCP package."
"pipefy_cli".msg = "pipefy_sdk must not import the CLI package."

# Intra-package layering, enforced by import-linter (run `uv run lint-imports`
# from this directory). MODULE-2 in docs/contributing/conventions.md states the
# rule; the root modules that still import the facade are listed under "Risks and
# technical debt" in docs/contributing/architecture.md.
[tool.importlinter]
root_package = "pipefy_sdk"

[[tool.importlinter.contracts]]
name = "No service imports the facade that publishes it"
type = "forbidden"
source_modules = ["pipefy_sdk.services"]
forbidden_modules = ["pipefy_sdk.client"]
