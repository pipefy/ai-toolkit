# Pre-commit hooks. Install once per clone with:
#
#     uvx pre-commit install
#
# Then every hook below runs on `git commit`, each only when a staged file
# matches its `files` pattern. If a hook
# rewrites a file, the commit is aborted — re-stage with `git add` and commit
# again. Bypass for a one-off WIP commit with `git commit --no-verify`. Run
# against the whole tree on demand with `uvx pre-commit run --all-files`.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.4
    hooks:
      - id: ruff
        args: [--fix]
      # `ruff --fix` must run before `ruff-format` (ruff-pre-commit docs).
      - id: ruff-format

  # shellcheck-py rather than the Docker-based koalaman hook: pre-commit
  # provisions it as a Python package, so the hook works for a contributor
  # without Docker. The version must stay in step with the CI job, which
  # installs the same release from PyPI.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--shell=sh]

  - repo: local
    hooks:
      # `sh -n` only, because macOS has no dash; CI runs `dash -n` too, where
      # /bin/sh really is dash and rejects what bash in POSIX mode forgives.
      - id: posix-syntax
        name: POSIX syntax check (sh -n)
        entry: sh -c 'for script in "$@"; do sh -n "$script" || exit 1; done' --
        language: system
        types: [shell]
      - id: deletion-guard
        name: deletions route through remove_path
        entry: python3 scripts/check_deletion_guard.py
        language: system
        files: ^uninstall\.sh$
        pass_filenames: false
      - id: pipe-drain
        name: consumers of a streaming producer read to the end
        entry: python3 scripts/check_pipe_drain.py
        language: system
        files: ^uninstall\.sh$
        pass_filenames: false
      - id: skill-frontmatter
        name: SKILL.md frontmatter
        entry: uv run python scripts/lint_skill_frontmatter.py
        language: system
        files: ^skills/
        pass_filenames: false
      - id: skill-refs
        name: skills name only shipped tools and commands
        entry: uv run python scripts/lint_skill_refs.py
        language: system
        files: ^(skills/|packages/(mcp|cli|sdk)/src/)
        pass_filenames: false
      # The lint reads `git ls-files`, and pre-commit runs on the index, so a
      # new skill counts once it is staged.
      - id: plugin-packaging
        name: plugin manifests list every published skill
        entry: python3 scripts/lint_plugin_packaging.py
        language: system
        files: ^(skills/|\.cursor-plugin/|\.claude-plugin/)
        pass_filenames: false
      - id: import-layers
        name: MCP import layers (lint-imports)
        entry: sh -c 'cd packages/mcp && uv run lint-imports'
        language: system
        files: ^packages/mcp/
        pass_filenames: false
