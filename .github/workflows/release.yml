name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-publication
  cancel-in-progress: false

env:
  RELEASE_PROTOCOL: "1"

permissions:
  contents: write
  id-token: write
  statuses: write
  pull-requests: read
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install release dependencies
        run: uv sync --locked --all-extras --dev
      - name: Restore or build original packages and test installation
        id: stage
        run: uv run python scripts/release_pipeline.py stage
      - name: Recheck authorization before the PyPI upload
        if: steps.stage.outputs.upload_required == 'true'
        run: uv run python scripts/release_pipeline.py guard
      - name: Upload missing original files to PyPI
        if: steps.stage.outputs.upload_required == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-pypi/
          # A stale inventory read can stage a wheel PyPI already has. The
          # staged bytes were hash-checked against the original manifest.
          skip-existing: true
      - name: Test public installations and record publication
        run: uv run python scripts/release_pipeline.py complete
