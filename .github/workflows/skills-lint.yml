name: Skills Lint

on:
  push:
    paths:
      - "skills/**"
      - "tests/test_lint_skill_frontmatter.py"
      - "pyproject.toml"
      - "uv.lock"
      - "packages/mcp/src/pipefy_mcp/tools/registry.py"
      - ".github/workflows/skills-lint.yml"
      - ".github/workflows/scripts/**"
  pull_request:
    paths:
      - "skills/**"
      - "tests/test_lint_skill_frontmatter.py"
      - "pyproject.toml"
      - "uv.lock"
      - "packages/mcp/src/pipefy_mcp/tools/registry.py"
      - ".github/workflows/skills-lint.yml"
      - ".github/workflows/scripts/**"

jobs:
  validate-skills:
    name: Validate skill frontmatter
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install workspace dependencies
        run: uv sync --locked --quiet

      - name: Validate SKILL.md frontmatter
        run: uv run python .github/workflows/scripts/lint_skill_frontmatter.py

      - name: Test frontmatter validation
        run: uv run pytest tests/test_lint_skill_frontmatter.py

      - name: Validate MCP and CLI references in skills
        run: uv run python .github/workflows/scripts/lint_skill_refs.py
